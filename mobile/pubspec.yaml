name: mindpulse
description: "MindPulse (SENSE) — Personalized Multimodal AI-Based Stress Monitoring & Early-Warning Mobile Application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  uuid: ^4.3.3
  intl: ^0.19.0
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.31.1
  sqflite_common_ffi: ^2.3.6
  sqlite3: ^2.9.0

flutter:
  uses-material-design: true

  # Poppins 4.004 (Google Fonts, SIL Open Font License 1.1 - see
  # assets/fonts/poppins/OFL.txt). Bundled so no font is fetched at runtime.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800


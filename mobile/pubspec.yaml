name: mindpulse
description: "MindPulse (SENSE) — Personalized Multimodal AI-Based Stress Monitoring & Early-Warning Mobile Application."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  path: ^1.9.0
  uuid: ^4.3.3
  intl: ^0.19.0
  crypto: ^3.0.3
  # Encrypted local database (Milestone J). Pinned EXACTLY: the pub.dev
  # publisher is unverified, so the version and archive hash (pubspec.lock)
  # were audited. Its Android engine is forced to the official SQLCipher for
  # Android 4.20.0 in android/build.gradle.kts. See
  # docs/architecture/encrypted_local_storage.md.
  sqflite_sqlcipher: 3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  # On-device tests for the Keystore + SQLCipher lifecycle (integration_test/).
  integration_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  test: ^1.31.1
  sqflite_common_ffi: ^2.3.6
  sqlite3: ^2.9.0
  # Static architecture guards parse Dart sources (test/support/
  # dart_source_guard.dart). Pinned to the version already locked as a
  # transitive dependency of `test`; test-only, never in the app.
  analyzer: 13.3.0

flutter:
  uses-material-design: true

  # Poppins 4.004 (Google Fonts, SIL Open Font License 1.1 - see
  # assets/fonts/poppins/OFL.txt). Bundled so no font is fetched at runtime.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800

